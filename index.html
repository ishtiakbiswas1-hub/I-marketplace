
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Connection Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f4;
      padding: 25px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-top: 50px;
      box-shadow: 0 4px 15px #0001;
    }
    #status {
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>I Marketplaces</h2>
    <h3>Firebase Connection Test</h3>
    <p id="status">Checking Firebase...</p>
  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

    import { getAuth }
      from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    import { getFirestore }
      from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyArpVV4O8XbnIa5mpykeIs-hxRhmXI8PJ8",
      authDomain: "i-marketplaces.firebaseapp.com",
      projectId: "i-marketplaces",
      storageBucket: "i-marketplaces.firebasestorage.app",
      messagingSenderId: "459809913983",
      appId: "1:459809913983:web:e0fd20625c9504ddc5534a",
      measurementId: "G-2ZRDZ7HSHT"
    };

    const status = document.getElementById("status");

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      status.textContent = "✅ Firebase Connected Successfully!";
      status.style.color = "green";

    } catch (error) {
      status.textContent = "❌ Connection Failed: " + error.message;
      status.style.color = "red";
    }
  </script>
</body>
</html>
